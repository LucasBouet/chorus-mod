[General]

## Dossier où les charts téléchargées sont installées.
# Setting type: String
SongsFolder = {{SONGS_FOLDER}}

## Touche pour ouvrir/fermer la fenêtre de recherche.
# Setting type: KeyCode
ToggleKey = {{TOGGLE_KEY}}

## Coupe le contrôleur clavier de Rewired pendant que le panneau est
## ouvert, pour que les touches tapées ne déclenchent pas les raccourcis
## de Clone Hero (Espace, etc.).
# Setting type: Boolean
BlockGameInput = {{BLOCK_INPUT}}

## false = scan incrémental après installation (rapide). true = scan
## complet (plus lent, plus fiable pour détecter les tout nouveaux
## dossiers).
# Setting type: Boolean
FullScan = {{FULL_SCAN}}

## Largeur de l'overlay en pixels.
# Setting type: Single
PanelWidth = {{PANEL_WIDTH}}

## Hauteur de l'overlay en pixels.
# Setting type: Single
PanelHeight = {{PANEL_HEIGHT}}

## Affiche les jaquettes dans la liste de résultats.
# Setting type: Boolean
ShowAlbumArt = {{SHOW_ALBUM_ART}}

## Opacité du fond du panneau quand la teinte GUI.color n'est pas
## disponible : nombre de passes de dessin empilées.
# Setting type: Int32
PanelOpacityLayers = 8

[API]

## Base URL de l'API Chorus Encore.
# Setting type: String
BaseUrl = https://api.enchor.us

## Chemin de l'endpoint de recherche (appelé en POST).
# Setting type: String
SearchEndpoint = /search

## Hôte des fichiers, utilisé pour les charts et les jaquettes.
# Setting type: String
FilesBaseUrl = https://files.enchor.us

## Filtre instrument envoyé au serveur par défaut à l'ouverture.
# Setting type: String
Instrument = guitar

## Écrit le JSON brut du premier résultat dans le log. À couper une fois
## que tout fonctionne.
# Setting type: Boolean
LogRawResponse = false
