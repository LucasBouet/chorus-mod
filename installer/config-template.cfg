[General]

## Folder where downloaded charts are installed.
# Setting type: String
SongsFolder = {{SONGS_FOLDER}}

## Key to open/close the search window.
# Setting type: KeyCode
ToggleKey = {{TOGGLE_KEY}}

## Disables Rewired's keyboard controller while the panel is open, so
## typed keys don't trigger Clone Hero's shortcuts (Space, etc.).
# Setting type: Boolean
BlockGameInput = {{BLOCK_INPUT}}

## false = incremental scan after install (fast). true = full scan
## (slower, more reliable for detecting brand new folders).
# Setting type: Boolean
FullScan = {{FULL_SCAN}}

## Format charts are installed in. sng = a single .sng file (default).
## zip = the classic folder (song.ini, chart, audio...), like the site's
## zip download, unpacked into the Songs folder.
# Setting type: String
# Default value: sng
# Acceptable values: sng, zip
DownloadFormat = sng

## Overlay width in pixels.
# Setting type: Single
PanelWidth = {{PANEL_WIDTH}}

## Overlay height in pixels.
# Setting type: Single
PanelHeight = {{PANEL_HEIGHT}}

## Shows album art in the results list.
# Setting type: Boolean
ShowAlbumArt = {{SHOW_ALBUM_ART}}

## Path to the JSON song list exported from Clone Hero's own Songs
## menu. Used by the in-game 'Sync' button to mark existing local charts
## as already downloaded.
# Setting type: String
LibraryExportPath = 

## Panel background opacity when the GUI.color tint isn't available:
## number of stacked draw passes.
# Setting type: Int32
PanelOpacityLayers = 8

[API]

## Base URL of the Chorus Encore API.
# Setting type: String
BaseUrl = https://api.enchor.us

## Path of the search endpoint (called via POST).
# Setting type: String
SearchEndpoint = /search

## File host, used for charts and album art.
# Setting type: String
FilesBaseUrl = https://files.enchor.us

## Instrument filter sent to the server by default on open.
# Setting type: String
Instrument = guitar

## Writes the raw JSON of the first result to the log. Turn off once
## everything works.
# Setting type: Boolean
LogRawResponse = false

[Trophies]

## ntfy server the trophy site publishes to.
# Setting type: String
NtfyServer = https://ntfy.sh

## ntfy topic carrying trophy / record events. Empty = trophy listener
## disabled. Anyone knowing this name can read and publish to it: don't
## share it.
# Setting type: String
NtfyTopic = {{NTFY_TOPIC}}

## Your username on the trophy site: only your own events get a toast
## (every event is still logged). Filled automatically from the
## Rythmania Tracker app's player.json when empty. Empty = toast every
## player's events.
# Setting type: String
Username = {{USERNAME}}

## Trophy site endpoint returning a player's profile, called with
## ?discordName=<Username>. Feeds the main-menu player card.
# Setting type: String
PlayerApiUrl = https://bdregieprod.com/ch_trophy_engine/api/usr.php

## Trophy site duel endpoint (players, scores, sent, received, create).
## Feeds the DUELS window on the main menu.
# Setting type: String
ChallengeApiUrl = https://bdregieprod.com/ch_trophy_engine/api/challenge_api.php

## Key to open/close the DUELS window from anywhere. None = no key.
# Setting type: KeyCode
DuelKey = F8

[Notifications]

## Toast when you unlock a trophy. Also toggled in-game from the
## SETTINGS button under the main-menu player card.
# Setting type: Boolean
TrophyUnlocked = {{TOAST_TROPHIES}}

## Toast when one of your records is beaten.
# Setting type: Boolean
RecordBeaten = {{TOAST_RECORDS}}

## Toast when you level up.
# Setting type: Boolean
LevelUp = {{TOAST_LEVELS}}

## Toast when another player challenges you to a duel.
# Setting type: Boolean
ChallengeReceived = {{TOAST_CHALLENGES}}

## Toast when a duel you took part in is decided (won or lost).
# Setting type: Boolean
ChallengeResult = {{TOAST_DUEL_RESULTS}}

## Toast for announcements sent by the trophy site to every player
## (tournaments, events...).
# Setting type: Boolean
Announcement = {{TOAST_ANNOUNCEMENTS}}

[Streamer]

## Hides everything the mod draws on screen (player card, SETTINGS and
## quit buttons, notifications). What you open yourself, like the search
## window, and gameplay tweaks keep working.
# Setting type: Boolean
StreamerMode = false

## Key turning streamer mode on and off. None = no key.
# Setting type: KeyCode
StreamerModeKey = F10

[Gameplay]

## Hides the solo percentage counter in local multiplayer and while
## connected to an online server. Also toggled in-game from the SETTINGS
## button under the main-menu player card.
# Setting type: Boolean
HideSoloCounterInMultiplayer = false

## Hides the game's news panel on the main menu (opacity only, the game
## keeps loading it).
# Setting type: Boolean
HideNewsPanel = false
