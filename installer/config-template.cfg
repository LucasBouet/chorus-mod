[General]

## Folder where downloaded charts are installed.
# Setting type: String
SongsFolder = {{SONGS_FOLDER}}

## Key to open/close the search window.
# Setting type: KeyCode
ToggleKey = {{TOGGLE_KEY}}

## Disables Rewired's keyboard controller while the panel is open, so
## typed keys don't trigger Clone Hero's shortcuts (Space, etc.).
# Setting type: Boolean
BlockGameInput = {{BLOCK_INPUT}}

## false = incremental scan after install (fast). true = full scan
## (slower, more reliable for detecting brand new folders).
# Setting type: Boolean
FullScan = {{FULL_SCAN}}

## Overlay width in pixels.
# Setting type: Single
PanelWidth = {{PANEL_WIDTH}}

## Overlay height in pixels.
# Setting type: Single
PanelHeight = {{PANEL_HEIGHT}}

## Shows album art in the results list.
# Setting type: Boolean
ShowAlbumArt = {{SHOW_ALBUM_ART}}

## Panel background opacity when the GUI.color tint isn't available:
## number of stacked draw passes.
# Setting type: Int32
PanelOpacityLayers = 8

[API]

## Base URL of the Chorus Encore API.
# Setting type: String
BaseUrl = https://api.enchor.us

## Path of the search endpoint (called via POST).
# Setting type: String
SearchEndpoint = /search

## File host, used for charts and album art.
# Setting type: String
FilesBaseUrl = https://files.enchor.us

## Instrument filter sent to the server by default on open.
# Setting type: String
Instrument = guitar

## Writes the raw JSON of the first result to the log. Turn off once
## everything works.
# Setting type: Boolean
LogRawResponse = false
